    // 2026-07-27 Figma 3D创作-已生成 UI：文本有内容或图生模式已有图片时切换按钮亮态，不改变原生成事件、额度扣减或模型选择逻辑。
    function syncPromptButtonState() {
      promptCount.textContent = prompt.value.length;
      const hasCreationInput = Boolean(prompt.value.trim()) || Boolean(uploads.querySelector('.upload.has-image'));
      generateButton.classList.toggle('is-ready', hasCreationInput);
    }

    prompt.addEventListener('input', syncPromptButtonState);
    syncPromptButtonState();

    let viewerEmptyLayoutTimer = 0;
    // 2026-07-27 响应式 UI：窗口变化后延迟到当前布局任务结束再按 Figma 720×794 基准测量，确保前台或后台页面都读取最新网格尺寸，避免小屏遮挡底部能力项。
    function syncViewerEmptyLayout() {
      clearTimeout(viewerEmptyLayoutTimer);
      viewerEmptyLayoutTimer = window.setTimeout(() => {
        viewerEmptyLayoutTimer = 0;
        const styles = getComputedStyle(viewerEmptyState);
        const verticalInset = (parseFloat(styles.paddingTop) || 0) + (parseFloat(styles.paddingBottom) || 0) + 16;
        const availableWidth = Math.max(1, viewerShell.clientWidth - 24);
        const availableHeight = Math.max(1, viewerShell.clientHeight - verticalInset);
        const scale = Math.max(0.3, Math.min(1, availableWidth / 720, availableHeight / 794));
        viewerEmptyState.style.setProperty('--viewer-empty-scale', scale.toFixed(4));
      }, 0);
    }

    window.addEventListener('resize', syncViewerEmptyLayout, { passive: true });
    if ('ResizeObserver' in window) new ResizeObserver(syncViewerEmptyLayout).observe(viewerShell);

    // 2026-07-24 修改逻辑：示例指令按钮只负责写入现有提示词输入框，并复用原字数统计事件。
    examplePromptButtons.forEach((button) => {
      button.addEventListener('click', () => {
        prompt.value = button.dataset.prompt || '';
        prompt.dispatchEvent(new Event('input', { bubbles: true }));
        prompt.focus();
      });
    });

    // 2026-07-24 修改逻辑：“换一批”在本地轮换示例文案，不请求接口，也不影响生成模型逻辑。
    const examplePromptPool = [
      '未来科幻风格的机器人，带机械臂',
      '中世纪风格的骑士，铠甲完整',
      '可爱的柴犬，带着围巾和帽子',
      '赛博朋克风格的女性角色，霓虹灯光',
      '古风少年，白色长袍与金色发冠',
      '低多边形风格的森林守护者'
    ];
    let examplePromptOffset = 0;
    exampleRefreshButton.addEventListener('click', () => {
      examplePromptOffset = (examplePromptOffset + 1) % examplePromptPool.length;
      examplePromptButtons.forEach((button, index) => {
        const nextPrompt = examplePromptPool[(examplePromptOffset + index) % examplePromptPool.length];
        button.dataset.prompt = nextPrompt;
        button.querySelector('span').textContent = nextPrompt;
      });
    });

    // 修改逻辑：图生 3D 只创建一个上传框，上传与拖放均只读取第一张图片。
    function createUpload() {
      const label = document.createElement('label');
      label.className = 'upload';
      label.innerHTML = `
        <input type="file" accept="image/png,image/jpeg,image/webp">
        <span class="upload-copy">
          <i data-lucide="image-up"></i>
          <span>上传图片</span>
          <small>点击选择或拖放图片</small>
        </span>
        <!-- 2026-07-24 修改逻辑：背景图负责两侧虚化补边，前景图保持完整比例，二者始终复用同一个图片来源。 -->
        <img class="preview-backdrop" alt="" aria-hidden="true">
        <img class="preview-img" alt="已上传图片预览">
        <button class="remove-image" type="button" title="移除图片" aria-label="移除图片"><i data-lucide="x"></i></button>
      `;

      const input = label.querySelector('input');
      const backdrop = label.querySelector('.preview-backdrop');
      const image = label.querySelector('.preview-img');
      const remove = label.querySelector('.remove-image');

      // 2026-07-24 修改逻辑：选择或拖放图片后把同一来源同步给虚化背景与完整前景，不需要额外确认或生成操作。
      const showFile = (file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.addEventListener('load', () => {
          backdrop.src = reader.result;
          image.src = reader.result;
          label.classList.add('has-image');
          // 2026-07-27 修改逻辑：用户上传或拖入有效图片后，立即同步生成按钮为亮绿可创作状态。
          syncPromptButtonState();
        });
        reader.readAsDataURL(file);
      };

      input.addEventListener('change', () => showFile(input.files[0]));
      label.addEventListener('dragover', (event) => { event.preventDefault(); label.classList.add('dragging'); });
      label.addEventListener('dragleave', () => label.classList.remove('dragging'));
      label.addEventListener('drop', (event) => {
        event.preventDefault();
        label.classList.remove('dragging');
        showFile(event.dataTransfer.files[0]);
      });
      remove.addEventListener('click', (event) => {
        event.preventDefault();
        input.value = '';
        backdrop.removeAttribute('src');
        image.removeAttribute('src');
        label.classList.remove('has-image');
        // 2026-07-24 修改逻辑：移除上传预览时一并清除示例图片选中态，避免界面误示仍在使用某个示例。
        exampleImageButtons.forEach((button) => button.classList.remove('active'));
        // 2026-07-27 修改逻辑：图片移除后重新依据文本内容决定按钮亮暗；若文本为空则恢复暗绿。
        syncPromptButtonState();
      });

      // 2026-07-24 修改逻辑：示例缩略图同步填入虚化背景与完整前景，复用现有预览与移除流程，不新增生成参数。
      label.showExampleImage = (source) => {
        input.value = '';
        backdrop.src = source;
        image.src = source;
        label.classList.add('has-image');
        // 2026-07-27 修改逻辑：示例图片回填与本地上传保持同一按钮亮态反馈。
        syncPromptButtonState();
      };
      return label;
    }

    function renderUpload() {
      uploads.replaceChildren(createUpload());
      lucide.createIcons();
    }

    // 2026-07-24 修改逻辑：点击任意 1:1 示例缩略图后立即显示到上传框，并用高亮边框标记当前选中的示例。
    function selectExampleImage(button) {
      if (!button) return;
      exampleImageButtons.forEach((item) => item.classList.toggle('active', item === button));
      const upload = uploads.querySelector('.upload');
      upload?.showExampleImage(button.dataset.exampleSrc);
    }

    exampleImageButtons.forEach((button) => {
      button.addEventListener('click', () => selectExampleImage(button));
    });

    // 2026-07-24 修改逻辑：两组数据分别对应默认的猫/木屋/猎人和备用的三张小老虎；刷新时整组替换图片、文案与无障碍标签。
    const exampleImageGroups = [
      [
        { src: './assets/example-cat.jpg', label: '小猫示例图片' },
        { src: './assets/example-cabin.jpg', label: '木屋示例图片' },
        { src: './assets/example-ranger.jpg', label: '猎人示例图片' }
      ],
      [
        { src: './assets/tiger-thumb.png', label: '老虎示例图片 1' },
        { src: './assets/tiger-thumb.png', label: '老虎示例图片 2' },
        { src: './assets/tiger-thumb.png', label: '老虎示例图片 3' }
      ]
    ];
    let exampleImageGroupIndex = 0;
    exampleImageRefreshButton.addEventListener('click', () => {
      // 2026-07-24 修改逻辑：“换一批”每次在两组三图之间循环，不再自动选图或改动当前上传预览。
      exampleImageGroupIndex = (exampleImageGroupIndex + 1) % exampleImageGroups.length;
      exampleImageButtons.forEach((button, index) => {
        const nextExample = exampleImageGroups[exampleImageGroupIndex][index];
        const image = button.querySelector('img');
        button.dataset.exampleSrc = nextExample.src;
        button.setAttribute('aria-label', `使用${nextExample.label}`);
        button.classList.remove('active');
        image.src = nextExample.src;
        image.alt = nextExample.label;
      });
    });

    // 修改逻辑：把世界坐标中的水平地面投影到当前模型相机画面，使网格随水平旋转和上下俯仰实时改变角度。
    function renderGroundGrid() {
      gridFrame = null;
      if (!viewer.loaded || !viewer.clientWidth || !viewer.clientHeight) return;

      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      const orbit = viewer.getCameraOrbit();
      const target = viewer.getCameraTarget();
      const dimensions = viewer.getDimensions();
      const fieldOfView = viewer.getFieldOfView() * Math.PI / 180;
      const sinPhi = Math.sin(orbit.phi);
      const camera = {
        x: target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
        y: target.y + orbit.radius * Math.cos(orbit.phi),
        z: target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
      };

      const normalize = (vector) => {
        const length = Math.hypot(vector.x, vector.y, vector.z) || 1;
        return { x: vector.x / length, y: vector.y / length, z: vector.z / length };
      };
      const cross = (a, b) => ({
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      });
      const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
      const forward = normalize({ x: target.x - camera.x, y: target.y - camera.y, z: target.z - camera.z });
      let right = normalize(cross(forward, { x: 0, y: 1, z: 0 }));
      if (Math.hypot(right.x, right.y, right.z) < .001) right = { x: 1, y: 0, z: 0 };
      const up = normalize(cross(right, forward));
      const focalLength = height / (2 * Math.tan(fieldOfView / 2));
      const near = Math.max(.01, orbit.radius * .002);

      const cameraPoint = (point) => {
        const relative = { x: point.x - camera.x, y: point.y - camera.y, z: point.z - camera.z };
        return { x: dot(relative, right), y: dot(relative, up), z: dot(relative, forward) };
      };
      const screenPoint = (point) => ({
        x: width / 2 + point.x * focalLength / point.z,
        y: height / 2 - point.y * focalLength / point.z
      });
      const projectSegment = (start, end) => {
        let a = cameraPoint(start);
        let b = cameraPoint(end);
        if (a.z <= near && b.z <= near) return null;
        if (a.z <= near || b.z <= near) {
          const behind = a.z <= near ? a : b;
          const ahead = a.z <= near ? b : a;
          const ratio = (near - behind.z) / (ahead.z - behind.z);
          const clipped = {
            x: behind.x + (ahead.x - behind.x) * ratio,
            y: behind.y + (ahead.y - behind.y) * ratio,
            z: near
          };
          if (a.z <= near) a = clipped;
          else b = clipped;
        }
        const p1 = screenPoint(a);
        const p2 = screenPoint(b);
        return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} L ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
      };

      // 修改逻辑：模型最低点定义为地面高度，网格原点位于模型中心正下方，因此脚部始终落在网格平面上。
      const groundY = target.y - dimensions.y / 2;
      const modelScale = Math.max(dimensions.x, dimensions.y, dimensions.z, .5);
      const minorStep = Math.max(.25, modelScale * .45);
      const halfLines = 36;
      const extent = minorStep * halfLines;
      const paths = { minor: [], major: [], axis: [] };
      for (let index = -halfLines; index <= halfLines; index += 1) {
        const offset = index * minorStep;
        const bucket = index === 0 ? paths.axis : index % 5 === 0 ? paths.major : paths.minor;
        const xLine = projectSegment(
          { x: target.x + offset, y: groundY, z: target.z - extent },
          { x: target.x + offset, y: groundY, z: target.z + extent }
        );
        const zLine = projectSegment(
          { x: target.x - extent, y: groundY, z: target.z + offset },
          { x: target.x + extent, y: groundY, z: target.z + offset }
        );
        if (xLine) bucket.push(xLine);
        if (zLine) bucket.push(zLine);
      }

      groundGrid.setAttribute('viewBox', `0 0 ${width} ${height}`);
      groundGridLines.innerHTML = `
        <path class="grid-minor" d="${paths.minor.join(' ')}" fill="none"></path>
        <path class="grid-major" d="${paths.major.join(' ')}" fill="none"></path>
        <path class="grid-axis" d="${paths.axis.join(' ')}" fill="none"></path>`;
    }

    function scheduleGroundGrid() {
      if (gridFrame === null) gridFrame = window.requestAnimationFrame(renderGroundGrid);
    }

    viewer.addEventListener('load', () => {
      loading.classList.add('hidden');
      scheduleGroundGrid();
    });
    viewer.addEventListener('camera-change', scheduleGroundGrid);
    window.addEventListener('resize', scheduleGroundGrid);
    // 2026-07-24 修改逻辑：模型已支持直接打开，不再提示用户启动已删除的本地服务。
    viewer.addEventListener('error', () => { loading.textContent = '预置古风男生模型加载失败，请重新打开页面'; });

    // 修改逻辑：统一读取预置或动态生成素材的纹理/白模路径，让所有已生成模型共用底部切换控件。
    function getMaterialConfig(card) {
      const kind = card?.dataset.modelKind;
      if (MATERIAL_SOURCES[kind]) {
        return { key: kind, ...MATERIAL_SOURCES[kind] };
      }
      if (card?.dataset.textureSrc && card?.dataset.whiteSrc) {
        return {
          key: `saved:${card.dataset.savedId || card.dataset.textureSrc}`,
          texture: card.dataset.textureSrc,
          white: card.dataset.whiteSrc
        };
      }
      return null;
    }

    function getAssetSource(card) {
      const config = getMaterialConfig(card);
      if (config) return config[materialModes[config.key] || 'texture'];
      return card.dataset.modelSrc;
    }

    function updateMaterialControls(card) {
      const config = getMaterialConfig(card);
      const supportsMaterials = Boolean(config);
      materialSwitch.hidden = !supportsMaterials;
      materialOptions.forEach((button) => {
        const selected = supportsMaterials && button.dataset.materialMode === (materialModes[config.key] || 'texture');
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    // 修改逻辑：只有选中可用素材时才展示下载/删除按钮，生成中的占位素材不允许操作。
    function updateAssetActions(card) {
      assetActions.hidden = !card || card.classList.contains('generating');
    }

    // 修改逻辑：素材全部删除后清空主预览与底部控制，避免继续显示已经不存在的 GLB。
    function clearAssetViewer() {
      document.querySelectorAll('.asset-card').forEach((item) => {
        item.classList.remove('active');
        item.setAttribute('aria-pressed', 'false');
      });
      viewer.removeAttribute('src');
      loading.textContent = '暂无可预览素材';
      loading.classList.remove('hidden');
      updateMaterialControls(null);
      updateAssetActions(null);
    }

    // 修改逻辑：素材选择监听改为事件委托，使 API 新增的模型卡片无需重复绑定事件。
    function selectAsset(card) {
      document.querySelectorAll('.asset-card').forEach((item) => {
        const selected = item === card;
        item.classList.toggle('active', selected);
        item.setAttribute('aria-pressed', String(selected));
      });
      const nextSource = getAssetSource(card);
      if (viewer.getAttribute('src') !== nextSource) {
        loading.textContent = '正在载入 3D 模型...';
        loading.classList.remove('hidden');
        viewer.setAttribute('src', nextSource);
      }
      updateMaterialControls(card);
      updateAssetActions(card);
    }

    assetList.addEventListener('click', (event) => {
      const card = event.target.closest('.asset-card');
      if (card && !card.classList.contains('generating')) {
        // 修改逻辑：生成过程中仍允许点击其他已完成素材；中央进度隐藏，右侧任务卡继续同步进度。
        if (viewerShell.classList.contains('generating')) viewerShell.classList.add('browsing-generation');
        // 2026-07-24 修改逻辑：点击右侧历史记录时直接恢复对应模型预览，并退出首次进入的空状态。
        viewerEmptyState.hidden = true;
        viewerShell.classList.remove('is-empty');
        selectAsset(card);
      }
    });

    // 修改逻辑：预置模型及以后每次生成的模型都可切换白模/纹理，右侧仍各自只占一个素材格。
    materialOptions.forEach((button) => {
      button.addEventListener('click', () => {
        const activeCard = document.querySelector('.asset-card.active');
        const config = getMaterialConfig(activeCard);
        if (!config) return;
        materialModes[config.key] = button.dataset.materialMode;
        updateMaterialControls(activeCard);
        const nextSource = getAssetSource(activeCard);
        if (viewer.getAttribute('src') !== nextSource) {
          loading.textContent = '正在切换模型材质...';
          loading.classList.remove('hidden');
          viewer.setAttribute('src', nextSource);
        }
      });
    });

    // 修改逻辑：Toast 统一在底部操作区上方短暂显示，下载触发成功后提示“下载成功”。
    function showToast(message) {
      window.clearTimeout(toastTimer);
      toastText.textContent = message;
      toast.classList.add('show');
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 修改逻辑：下载当前正在查看的版本，白模模式下载白模 GLB，纹理模式下载纹理 GLB。
    downloadAssetButton.addEventListener('click', async () => {
      const activeCard = document.querySelector('.asset-card.active');
      if (!activeCard) return;
      downloadAssetButton.disabled = true;
      try {
        const source = getAssetSource(activeCard);
        const response = await fetch(source);
        if (!response.ok) throw new Error(`下载失败 (${response.status})`);
        const blobUrl = URL.createObjectURL(await response.blob());
        const config = getMaterialConfig(activeCard);
        const mode = config ? (materialModes[config.key] || 'texture') : 'texture';
        const baseName = (activeCard.dataset.modelName || '3D模型.glb').replace(/\.glb$/i, '');
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `${baseName}${mode === 'white' ? '-白模' : ''}.glb`;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        showToast('下载成功');
      } catch (error) {
        updateJobStatus(error.message || '下载失败，请重试', 'error');
      } finally {
        downloadAssetButton.disabled = false;
      }
    });

    // 2026-07-24 修改逻辑：删除只重置浏览器中的当前预览，保留隐藏的预置数据供下一次两秒生成复用。
    deleteAssetButton.addEventListener('click', () => {
      if (document.querySelector('.asset-card.active')) deleteDialog.showModal();
    });
    cancelDeleteButton.addEventListener('click', () => deleteDialog.close());
    confirmDeleteButton.addEventListener('click', () => {
      clearAssetViewer();
      viewerShell.classList.add('is-empty');
      viewerEmptyState.hidden = false;
      loading.classList.add('hidden');
      deleteDialog.close();
      updateJobStatus('当前模型已删除', 'success');
      showToast('模型已删除');
    });

    function updateJobStatus(message, state = '') {
      jobStatus.textContent = message;
      jobStatus.dataset.state = state;
    }

    // 修改逻辑：中央与右侧素材占位卡共用同一进度；GLB 真正加载完成前最高为 99%，不会提前显示 100%。
    function updateGenerationProgress(percent, message) {
      const value = Math.max(0, Math.min(100, Math.round(percent)));
      generationProgressBar.style.width = `${value}%`;
      generationProgressValue.textContent = `${value}%`;
      generationProgressText.textContent = message;
      const pendingCard = assetList.querySelector('.asset-card.generating');
      if (pendingCard) {
        pendingCard.querySelector('.asset-generating-value').textContent = `${value}%`;
        pendingCard.querySelector('.asset-progress-bar').style.width = `${value}%`;
      }
    }

    function setGenerating(active) {
      viewerShell.classList.toggle('generating', active);
      // 修改逻辑：每个新任务从中央进度开始，任务结束后清理临时的素材浏览状态。
      viewerShell.classList.remove('browsing-generation');
      document.body.classList.toggle('hunyuan-generating', active);
      generationProgress.setAttribute('aria-hidden', String(!active));
    }

    // 2026-07-24 修改逻辑：演示流程不再请求真实生成接口；点击后用原进度条模拟两秒生成，再展示预置古风人物模型。
    async function generateModel() {
      if (generateButton.disabled || remainingGenerations <= 0) return;
      // 2026-07-24 修改逻辑：生成按钮只准备本地预置资源，不调用任何模型生成接口。
      const presetSourcesReady = preparePresetModelSources();
      remainingGenerations -= 1;
      // 2026-07-24 修改逻辑：生成后同步更新底部保留的“剩余次数”文字。
      remainingGenerationsLabel.textContent = String(remainingGenerations);
      generateButton.setAttribute('aria-label', `生成模型，剩余 ${remainingGenerations} 次`);
      generateButton.disabled = true;
      viewerEmptyState.hidden = true;
      viewerShell.classList.remove('is-empty');
      setGenerating(true);
      // 2026-07-24 修改逻辑：模拟进度全程使用固定文案，避免不同阶段文字跳变干扰用户。
      updateGenerationProgress(0, '正在生成中...');
      updateJobStatus('正在生成古风人物模型...', 'working');

      const ancientCard = assetList.querySelector('.asset-card[data-model-kind="ancient-character"]');
      const startTime = performance.now();
      const duration = 2000;

      try {
        await new Promise((resolve) => {
          const tick = (now) => {
            const elapsed = now - startTime;
            const percent = Math.min(99, Math.round((elapsed / duration) * 100));
            updateGenerationProgress(percent, '正在生成中...');
            if (elapsed >= duration) resolve();
            else requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });

        await presetSourcesReady;
        if (!ancientCard) throw new Error('古风人物模型资源不存在');
        selectAsset(ancientCard);
        updateGenerationProgress(100, '生成完成');
        setGenerating(false);
        updateJobStatus('古风人物模型生成完成', 'success');
      } catch (error) {
        setGenerating(false);
        viewerShell.classList.add('is-empty');
        viewerEmptyState.hidden = false;
        updateJobStatus(error.message || '生成失败，请重试', 'error');
      } finally {
        // 2026-07-24 修改逻辑：两秒生成结束后恢复按钮；额度耗尽时继续禁用，避免出现负次数。
        generateButton.disabled = remainingGenerations <= 0;
      }
    }

    generateButton.addEventListener('click', generateModel);

    renderUpload();
    // 2026-07-24 修改逻辑：直接打开页面时提前准备内嵌模型，让两秒进度结束后立即展示预置角色。
    preparePresetModelSources().catch(() => {});
    lucide.createIcons();
    // 2026-07-24 修改逻辑：每次进入页面都从未生成状态开始，不恢复或自动选中任何历史模型。
    viewerShell.classList.add('is-empty');
    updateMaterialControls(null);
    updateAssetActions(null);
    syncViewerEmptyLayout();
  </script>
</body>
</html>
